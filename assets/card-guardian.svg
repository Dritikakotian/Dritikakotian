<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" fill="none">
  <style>
    .f { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .ring { animation: ping 3s cubic-bezier(0,0,.2,1) infinite; transform-origin: 400px 200px; }
    .r2 { animation-delay: 1s; } .r3 { animation-delay: 2s; }
    @keyframes ping { 0% { transform: scale(.2); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
    .sweep { animation: spin 4s linear infinite; transform-origin: 400px 200px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pin { animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .sos { animation: flash 1.2s steps(1) infinite; }
    @keyframes flash { 50% { opacity: .35; } }
    .glow { animation: gl 4s ease-in-out infinite; }
    @keyframes gl { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  </style>
  <defs>
    <linearGradient id="bd" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#22c55e" stop-opacity=".1"/></linearGradient>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e" stop-opacity="0"/><stop offset="1" stop-color="#22c55e" stop-opacity=".55"/></linearGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="490" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="490" height="300" fill="#0b0b14"/>
    <circle class="glow" cx="400" cy="210" r="110" fill="#059669" filter="url(#b)"/>

    <!-- radar -->
    <g stroke="#22c55e">
      <circle cx="400" cy="200" r="30" stroke-opacity=".25"/>
      <circle cx="400" cy="200" r="60" stroke-opacity=".18"/>
      <circle cx="400" cy="200" r="90" stroke-opacity=".12"/>
      <circle class="ring r1" cx="400" cy="200" r="60" stroke-width="2"/>
      <circle class="ring r2" cx="400" cy="200" r="60" stroke-width="2"/>
      <circle class="ring r3" cx="400" cy="200" r="60" stroke-width="2"/>
    </g>
    <g class="sweep"><path d="M400 200 L490 200 A90 90 0 0 0 463.6 136.4 Z" fill="url(#sw)"/></g>
    <g fill="#4ade80" filter="url(#g)">
      <circle cx="360" cy="160" r="3.5"/><circle cx="445" cy="230" r="3"/><circle cx="430" cy="150" r="2.5"/>
    </g>
    <!-- location pin -->
    <g class="pin" filter="url(#g)">
      <path d="M400 214 C390 200 384 192 384 184 a16 16 0 0 1 32 0 c0 8 -6 16 -16 30z" fill="#ef4444"/>
      <circle cx="400" cy="184" r="6" fill="#fff"/>
    </g>
    <g class="sos">
      <rect x="400" y="34" width="64" height="28" rx="14" fill="#ef4444"/>
      <text x="432" y="53" text-anchor="middle" class="f" font-size="14" font-weight="800" fill="#fff">SOS</text>
    </g>

    <text x="28" y="56" class="f" font-size="30" font-weight="800" fill="url(#tt)">🛡️ Guardian</text>
    <text x="28" y="84" class="f" font-size="15" fill="#d1d5db">A personal-safety app in your pocket</text>

    <g class="f" font-size="14" fill="#e5e7eb">
      <text x="28" y="124">🚨 One-touch SOS + emergency recording</text>
      <text x="28" y="150">📍 Live location &amp; safe journeys</text>
      <text x="28" y="176">👥 Trusted contacts &amp; community alerts</text>
      <text x="28" y="202">📞 Fake call &amp; safety check-in timer</text>
      <text x="28" y="228">🤖 AI safety assistant</text>
    </g>

    <g class="m" font-size="11">
      <rect x="28" y="252" width="98" height="24" rx="12" fill="#61dafb" fill-opacity=".15" stroke="#61dafb"/><text x="77" y="268" text-anchor="middle" fill="#a5f3fc">React Native</text>
      <rect x="134" y="252" width="48" height="24" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#9ca3af"/><text x="158" y="268" text-anchor="middle" fill="#e5e7eb">Expo</text>
      <rect x="190" y="252" width="74" height="24" rx="12" fill="#22c55e" fill-opacity=".15" stroke="#22c55e"/><text x="227" y="268" text-anchor="middle" fill="#86efac">Supabase</text>
    </g>
  </g>
  <rect x="1" y="1" width="488" height="298" rx="19" stroke="url(#bd)" stroke-width="2"/>
</svg>
