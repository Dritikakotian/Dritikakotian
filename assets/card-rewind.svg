<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" fill="none">
  <style>
    .f { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .edge { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .n { animation: pop 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; } .n5 { animation-delay: 2.4s; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    .clock { animation: rev 6s cubic-bezier(.6,0,.4,1) infinite; transform-origin: 438px 52px; }
    @keyframes rev { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-360deg); } }
    .glow { animation: gl 4s ease-in-out infinite; }
    @keyframes gl { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  </style>
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity=".1"/></linearGradient>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="490" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="490" height="300" fill="#0b0b14"/>
    <circle class="glow" cx="420" cy="240" r="110" fill="#7c3aed" filter="url(#b)"/>

    <!-- context graph -->
    <g stroke="#c084fc" stroke-opacity=".7" stroke-width="1.5">
      <path class="edge" d="M330 230 L380 180"/><path class="edge" d="M380 180 L440 205"/>
      <path class="edge" d="M380 180 L400 125"/><path class="edge" d="M440 205 L455 260"/>
      <path class="edge" d="M330 230 L395 265"/><path class="edge" d="M395 265 L455 260"/>
    </g>
    <g filter="url(#g)">
      <circle class="n n1" cx="330" cy="230" r="7" fill="#f472b6"/>
      <circle class="n n2" cx="380" cy="180" r="9" fill="#a855f7"/>
      <circle class="n n3" cx="440" cy="205" r="6" fill="#22d3ee"/>
      <circle class="n n4" cx="400" cy="125" r="5" fill="#fbbf24"/>
      <circle class="n n5" cx="455" cy="260" r="7" fill="#22c55e"/>
      <circle class="n n3" cx="395" cy="265" r="5" fill="#f87171"/>
    </g>
    <g class="m" font-size="10" fill="#9ca3af">
      <text x="345" y="122">decision</text><text x="300" y="250">error</text><text x="448" y="198">fix</text>
    </g>

    <!-- rewind clock icon -->
    <circle cx="438" cy="52" r="22" fill="#a855f7" fill-opacity=".15" stroke="#a855f7" stroke-opacity=".6"/>
    <g class="clock"><path d="M438 52 V38 M438 52 L448 58" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/></g>

    <text x="28" y="56" class="f" font-size="30" font-weight="800" fill="url(#tt)">⏪ Project Rewind</text>
    <text x="28" y="84" class="f" font-size="15" fill="#d1d5db">Persistent memory for developers &amp; AI agents</text>

    <g class="f" font-size="14" fill="#e5e7eb">
      <text x="28" y="124">🧩 VS Code extension + Python engine</text>
      <text x="28" y="150">🕸️ Live context graph of tasks &amp; fixes</text>
      <text x="28" y="176">🤖 MCP server for any AI agent</text>
      <text x="28" y="202">🔒 100% local · 0 dependencies</text>
      <text x="28" y="228">✅ 71 automated tests</text>
    </g>

    <g class="m" font-size="11">
      <rect x="28" y="252" width="62" height="24" rx="12" fill="#3776ab" fill-opacity=".25" stroke="#3776ab"/><text x="59" y="268" text-anchor="middle" fill="#93c5fd">Python</text>
      <rect x="98" y="252" width="62" height="24" rx="12" fill="#0ea5e9" fill-opacity=".2" stroke="#0ea5e9"/><text x="129" y="268" text-anchor="middle" fill="#7dd3fc">SQLite</text>
      <rect x="168" y="252" width="44" height="24" rx="12" fill="#a855f7" fill-opacity=".2" stroke="#a855f7"/><text x="190" y="268" text-anchor="middle" fill="#d8b4fe">MCP</text>
      <rect x="220" y="252" width="70" height="24" rx="12" fill="#facc15" fill-opacity=".15" stroke="#facc15"/><text x="255" y="268" text-anchor="middle" fill="#fde68a">VS Code</text>
    </g>
  </g>
  <rect x="1" y="1" width="488" height="298" rx="19" stroke="url(#bd)" stroke-width="2"/>
</svg>
