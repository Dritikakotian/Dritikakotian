<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none">
  <style>
    .font { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }

    /* aurora blobs drifting */
    .b1 { animation: drift1 14s ease-in-out infinite alternate; transform-origin: center; }
    .b2 { animation: drift2 18s ease-in-out infinite alternate; transform-origin: center; }
    .b3 { animation: drift3 16s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(180px,40px) scale(1.25); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-220px,-30px) scale(0.9); } }
    @keyframes drift3 { from { transform: translate(0,0) scale(0.9); } to { transform: translate(120px,-50px) scale(1.2); } }

    /* intro reveal */
    .hello { opacity: 0; animation: up .8s ease-out .2s forwards; }
    .name  { opacity: 0; animation: up 1s cubic-bezier(.2,.8,.2,1) .5s forwards; }
    .line  { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.2s ease-out 1.1s forwards; }
    .pill  { opacity: 0; animation: up .8s ease-out 1.6s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* rotating roles: 4 lines, 12s cycle */
    .role { opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(12px); }
      4%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      26%  { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; }
    }

    /* live dot */
    .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: 660px 271px; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.6); } }

    /* orbiting ring on the right */
    .orbit  { animation: spin 22s linear infinite; transform-origin: 830px 170px; }
    .orbit2 { animation: spin 34s linear infinite reverse; transform-origin: 830px 170px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .core { animation: breathe 4s ease-in-out infinite; transform-origin: 830px 170px; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* twinkle stars */
    .s { animation: tw 3s ease-in-out infinite; }
    .s:nth-child(2n) { animation-delay: .8s; } .s:nth-child(3n) { animation-delay: 1.7s; } .s:nth-child(5n) { animation-delay: 2.3s; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <defs>
    <clipPath id="card"><rect width="1000" height="340" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".35" stop-color="#ec4899"/>
      <stop offset=".65" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22c55e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="spread" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ec4899" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="coreG">
      <stop offset="0" stop-color="#f0abfc"/><stop offset=".45" stop-color="#a855f7"/><stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="#07070d"/>
    <!-- aurora -->
    <g filter="url(#blur)" opacity=".85">
      <circle class="b1" cx="180" cy="80"  r="170" fill="#7c3aed"/>
      <circle class="b2" cx="760" cy="300" r="190" fill="#db2777" opacity=".7"/>
      <circle class="b3" cx="460" cy="360" r="150" fill="#059669" opacity=".8"/>
    </g>
    <rect width="1000" height="340" fill="url(#grid)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle class="s" cx="610" cy="40" r="1.4"/><circle class="s" cx="700" cy="88" r="1"/>
      <circle class="s" cx="955" cy="60" r="1.6"/><circle class="s" cx="930" cy="280" r="1.1"/>
      <circle class="s" cx="560" cy="300" r="1.2"/><circle class="s" cx="980" cy="170" r="1"/>
      <circle class="s" cx="660" cy="200" r="1.3"/><circle class="s" cx="720" cy="30" r="1"/>
      <circle class="s" cx="45"  cy="300" r="1.2"/><circle class="s" cx="380" cy="30" r="1"/>
    </g>

    <!-- orbit visual -->
    <g opacity=".95">
      <circle cx="830" cy="170" r="118" stroke="#ffffff" stroke-opacity=".08"/>
      <circle cx="830" cy="170" r="82"  stroke="#ffffff" stroke-opacity=".1" stroke-dasharray="4 8"/>
      <g class="orbit">
        <circle cx="830" cy="170" r="118" stroke="url(#spread)" stroke-width="2" stroke-dasharray="120 620" stroke-linecap="round"/>
        <circle cx="948" cy="170" r="7" fill="#22c55e" filter="url(#glow)"/>
      </g>
      <g class="orbit2">
        <circle cx="830" cy="88" r="5" fill="#ec4899" filter="url(#glow)"/>
        <circle cx="830" cy="252" r="3.5" fill="#22d3ee" filter="url(#glow)"/>
      </g>
      <circle class="core" cx="830" cy="170" r="54" fill="url(#coreG)"/>
      <text x="830" y="182" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#fff" filter="url(#glow)">&lt;/&gt;</text>
    </g>

    <!-- text -->
    <text class="hello mono" x="64" y="92" font-size="18" fill="#c4b5fd" letter-spacing="2">// hello world, I'm</text>
    <text class="name font" x="60" y="168" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#shimmer)">Dritika</text>
    <path class="line" d="M64 190 H484" stroke="url(#spread)" stroke-width="3" stroke-linecap="round"/>

    <g class="font" font-size="24" font-weight="600" fill="#e5e7eb">
      <text class="role r1" x="64" y="232">🛠️ Building tools developers actually use</text>
      <text class="role r2" x="64" y="232">📱 Shipping mobile apps with React Native</text>
      <text class="role r3" x="64" y="232">🤖 Exploring AI, ML &amp; Robotics</text>
      <text class="role r4" x="64" y="232">🏆 Hackathon builder · idea → live demo</text>
    </g>

    <g class="pill">
      <rect x="64" y="256" width="250" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="84" cy="272" r="5" fill="#22c55e"/>
      <circle cx="84" cy="272" r="5" fill="#22c55e" opacity=".5">
        <animate attributeName="r" values="5;11;5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0;.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="277" class="font" font-size="14" fill="#d1d5db">Engineering student · open to collab</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="338" rx="23" stroke="url(#border)" stroke-width="2"/>
</svg>
